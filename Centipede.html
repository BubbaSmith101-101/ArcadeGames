<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Centipede – HTML5 Canvas (with initial mushrooms)</title>
<style>
  body{
    margin:0;
    background:#000;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    overflow:hidden;
    user-select:none;
  }
  #gameCanvas{
    display:block;
    margin:0 auto;
    background:#111;
    border:2px solid #555;
  }
  #overlay{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:2rem;
    color:#fff;
    background:rgba(0,0,0,0.7);
    pointer-events:none;
  }
</style>
</head>
<body>
<canvas id="gameCanvas" width="480" height="640"></canvas>
<div id="overlay"></div>

<script>
/* --------------------------------------------------------------
   CENTIPEDE – tiny playable clone (now with initial mushrooms)
   --------------------------------------------------------------
   Controls
   --------------------------------------------------------------
   ← / →  : Move the shooter left / right
   Space   : Fire
   P       : Pause / un‑pause
   --------------------------------------------------------------*/

const canvas = document.getElementById('gameCanvas');
const ctx    = canvas.getContext('2d');
const overlay = document.getElementById('overlay');

const WIDTH  = canvas.width;
const HEIGHT = canvas.height;

// ----------------------------------------------------------
// Game constants
// ----------------------------------------------------------
const PLAYER_SPEED    = 4;
const BULLET_SPEED    = 8;
const CENTIPEDE_SPEED = 2;          // horizontal pixels per frame
const CENTIPEDE_DROP  = 16;         // vertical drop when turning
const MUSHROOM_SIZE   = 8;
const MAX_MUSHROOMS   = 250;

// ----------------------------------------------------------
// Game state
// ----------------------------------------------------------
let keys = {};
let score = 0;
let lives = 3;
let level = 1;
let gameOver = false;
let paused = false;

// ----------------------------------------------------------
// Helper utilities
// ----------------------------------------------------------
function rectCollision(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}

// ----------------------------------------------------------
// Player (the “shooter”)
// ----------------------------------------------------------
class Player {
  constructor() {
    this.width  = 20;
    this.height = 12;
    this.x = (WIDTH - this.width) / 2;
    this.y = HEIGHT - this.height - 8;
    this.color = '#0f0';
    this.canShoot = true;
    this.shootCooldown = 0;
  }
  update() {
    if (keys['ArrowLeft']  && this.x > 0)               this.x -= PLAYER_SPEED;
    if (keys['ArrowRight'] && this.x + this.width < WIDTH) this.x += PLAYER_SPEED;

    // shooting
    if (keys[' '] && this.canShoot) {
      bullets.push(new Bullet(this.x + this.width/2, this.y));
      this.canShoot = false;
      this.shootCooldown = 12;
    }
    if (!this.canShoot) {
      this.shootCooldown--;
      if (this.shootCooldown <= 0) this.canShoot = true;
    }
  }
  draw() {
    ctx.fillStyle = this.color;
    ctx.fillRect(this.x, this.y, this.width, this.height);
    ctx.fillStyle = '#fff';
    ctx.fillRect(this.x + this.width/2 - 2, this.y - 4, 4, 4);
  }
}

// ----------------------------------------------------------
// Bullet
// ----------------------------------------------------------
class Bullet {
  constructor(x, y) {
    this.x = x - 2;
    this.y = y;
    this.width = 4;
    this.height = 10;
    this.color = '#ff0';
    this.active = true;
  }
  update() {
    this.y -= BULLET_SPEED;
    if (this.y + this.height < 0) this.active = false;
  }
  draw() {
    ctx.fillStyle = this.color;
    ctx.fillRect(this.x, this.y, this.width, this.height);
  }
}

// ----------------------------------------------------------
// Mushroom
// ----------------------------------------------------------
class Mushroom {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.maxHealth = 4;   // 4 hits to destroy
    this.health = this.maxHealth;
  }
  hit() {
    this.health--;
    if (this.health <= 0) {
      const i = mushrooms.indexOf(this);
      if (i >= 0) mushrooms.splice(i, 1);
    }
  }
  draw() {
    const shade = 0x33 + (this.maxHealth - this.health) * 0x33;
    ctx.fillStyle = `rgb(${shade},${shade},${shade})`;
    ctx.fillRect(this.x, this.y, MUSHROOM_SIZE, MUSHROOM_SIZE);
  }
}

// ----------------------------------------------------------
// Centipede segment
// ----------------------------------------------------------
class Segment {
  constructor(x, y, isHead = false) {
    this.x = x;
    this.y = y;
    this.isHead = isHead;
    this.dir = 1; // 1 = right, -1 = left
  }
  update() {
    // move horizontally
    this.x += this.dir * CENTIPEDE_SPEED;

    // turn on wall or mushroom
    const hitWall = this.x < 0 || this.x + MUSHROOM_SIZE > WIDTH;
    const hitMush = isMushroomAt(this.x, this.y);
    if (hitWall || hitMush) {
      this.x -= this.dir * CENTIPEDE_SPEED; // step back
      this.y += CENTIPEDE_DROP;            // drop a row
      this.dir *= -1;                      // reverse direction
    }

    // reached the player?
    if (this.y + MUSHROOM_SIZE >= player.y) loseLife();
  }
  draw() {
    ctx.fillStyle = this.isHead ? '#f00' : '#0ff';
    ctx.fillRect(this.x, this.y, MUSHROOM_SIZE, MUSHROOM_SIZE);
  }
}

// ----------------------------------------------------------
// Containers for game objects
// ----------------------------------------------------------
let player   = new Player();
let bullets  = [];
let mushrooms = [];
let centipede = [];

// ----------------------------------------------------------
// Helper: is there a mushroom at the given pixel?
// ----------------------------------------------------------
function isMushroomAt(px, py) {
  for (const m of mushrooms) {
    if (px < m.x + MUSHROOM_SIZE && px + MUSHROOM_SIZE > m.x &&
        py < m.y + MUSHROOM_SIZE && py + MUSHROOM_SIZE > m.y) {
      return true;
    }
  }
  return false;
}

// ----------------------------------------------------------
// Helper – generate a random mushroom field
// ----------------------------------------------------------
function generateMushrooms(count = 30) {
  let attempts = 0;
  const maxAttempts = count * 10;

  while (mushrooms.length < count && attempts < maxAttempts) {
    attempts++;

    const mx = Math.floor(Math.random() * (WIDTH / MUSHROOM_SIZE)) * MUSHROOM_SIZE;
    const my = Math.floor(Math.random() * (HEIGHT / 2 / MUSHROOM_SIZE)) * MUSHROOM_SIZE;

    // don't put a mushroom on the player
    const overPlayer = rectCollision(
      mx, my, MUSHROOM_SIZE, MUSHROOM_SIZE,
      player.x, player.y, player.width, player.height
    );

    // avoid stacking mushrooms
    const alreadyThere = isMushroomAt(mx, my);

    if (!overPlayer && !alreadyThere) {
      mushrooms.push(new Mushroom(mx, my));
    }
  }
}

// ----------------------------------------------------------
// Spawn a fresh centipede (called at start & after each wave)
// ----------------------------------------------------------
function spawnCentipede() {
  const length = Math.max(10, 12 - level);
  centipede = [];

  // head at the left edge; body follows to the right
  for (let i = 0; i < length; i++) {
    const x = i * MUSHROOM_SIZE;
    centipede.push(new Segment(x, 0, i === 0));
  }
}

// ----------------------------------------------------------
// Player loses a life
// ----------------------------------------------------------
function loseLife() {
  if (gameOver) return;
  lives--;
  if (lives <= 0) {
    gameOver = true;
    overlay.textContent = `Game Over – Score ${score}`;
  } else {
    player = new Player();
    bullets = [];
    paused = true;
    setTimeout(() => paused = false, 1500);
  }
}

// ----------------------------------------------------------
// Main loop
// ----------------------------------------------------------
function gameLoop() {
  if (!paused && !gameOver) {
    update();
    draw();
  }
  requestAnimationFrame(gameLoop);
}

// ----------------------------------------------------------
// Update everything
// ----------------------------------------------------------
function update() {
  player.update();

  // ---- bullets ------------------------------------------------
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.update();
    if (!b.active) { bullets.splice(i, 1); continue; }

    // hit a mushroom?
    for (let j = mushrooms.length - 1; j >= 0; j--) {
      const m = mushrooms[j];
      if (rectCollision(b.x,b.y,b.width,b.height,
                        m.x,m.y,MUSHROOM_SIZE,MUSHROOM_SIZE)) {
        m.hit();
        b.active = false;
        bullets.splice(i,1);
        break;
      }
    }
    if (!b.active) continue;

    // hit a centipede segment?
    for (let k = centipede.length - 1; k >= 0; k--) {
      const seg = centipede[k];
      if (rectCollision(b.x,b.y,b.width,b.height,
                        seg.x,seg.y,MUSHROOM_SIZE,MUSHROOM_SIZE)) {
        // turn segment into a mushroom (if free)
        if (!isMushroomAt(seg.x, seg.y) && mushrooms.length < MAX_MUSHROOMS) {
          mushrooms.push(new Mushroom(seg.x, seg.y));
        }
        // remove the segment
        centipede.splice(k,1);
        score += seg.isHead ? 100 : 10;
        b.active = false;
        bullets.splice(i,1);
        break;
      }
    }
  }

  // ---- centipede movement ------------------------------------
  for (let i = centipede.length - 1; i >= 0; i--) {
    centipede[i].update();
  }

  // ---- wave cleared? -----------------------------------------
  if (centipede.length === 0) {
    level++;
    // add a few random mushrooms to make the next level harder
    for (let i = 0; i < 5 + level; i++) {
      const mx = Math.floor(Math.random() * (WIDTH / MUSHROOM_SIZE)) * MUSHROOM_SIZE;
      const my = Math.floor(Math.random() * (HEIGHT/2 / MUSHROOM_SIZE)) * MUSHROOM_SIZE;
      if (!isMushroomAt(mx, my) &&
          !rectCollision(mx,my,MUSHROOM_SIZE,MUSHROOM_SIZE,
                        player.x,player.y,player.width,player.height)) {
        mushrooms.push(new Mushroom(mx, my));
      }
    }
    spawnCentipede();
  }
}

// ----------------------------------------------------------
// Render everything
// ----------------------------------------------------------
function draw() {
  ctx.fillStyle = '#111';
  ctx.fillRect(0,0,WIDTH,HEIGHT);

  // mushrooms
  for (const m of mushrooms) m.draw();

  // centipede
  for (const seg of centipede) seg.draw();

  // bullets
  for (const b of bullets) b.draw();

  // player
  player.draw();

  // UI
  ctx.fillStyle = '#fff';
  ctx.font = '16px monospace';
  ctx.textBaseline = 'top';
  ctx.fillText(`Score: ${score}`, 8, 8);
  ctx.fillText(`Lives: ${lives}`, 8, 28);
  ctx.fillText(`Level: ${level}`, 8, 48);
}

// ----------------------------------------------------------
// Input handling
// ----------------------------------------------------------
window.addEventListener('keydown', e => {
  if (e.key === ' ') e.preventDefault();
  keys[e.key] = true;
  if (e.key === 'p') paused = !paused;
});
window.addEventListener('keyup', e => keys[e.key] = false);

// ---------------------------------------------------------
// Start the game
// ----------------------------------------------------------
spawnCentipede();          // create the first centipede
generateMushrooms(30);    // <<< NEW: initial mushroom field
gameLoop();
</script>
</body>
</html>
