<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Frogger Mini‑Game</title>
<style>
  body {
    margin: 0;
    overflow: hidden;
    background:#222;
    font-family:Arial,Helvetica,sans-serif;
    color:#fff;
  }
  #info {
    position:fixed;
    top:10px;
    left:10px;
    background:rgba(0,0,0,0.5);
    padding:0.5rem 1rem;
    border-radius:5px;
    font-size:14px;
    line-height:1.5;
  }
  canvas {
    display:block;
    margin:auto;
    background:#2c3e50;
    border:4px solid #95a5a6;
  }
</style>
</head>
<body>

<div id="info">
  <strong>Frogger Mini‑Game</strong><br>
  Use <b>← ↑ → ↓</b> keys to move.<br>
  Reach the green “home” strip at the top.<br>
  Press <b>R</b> to restart.
</div>

<canvas id="game" width="500" height="600"></canvas>

<script>
/* --------------------------------------------------------------
   Simple Frogger clone – 2024
   --------------------------------------------------------------
   * Canvas‑based, no external assets.
   * 5 lanes of traffic, 3 lanes of logs.
   * One “frog” that you move with the arrow keys.
   * Reach the green strip at the top to win.
   -------------------------------------------------------------- */

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const W = canvas.width;
const H = canvas.height;

// ----------------------------------------------------------
// Game configuration (tweak any of these for difficulty)
// ----------------------------------------------------------
const config = {
  laneHeight: 60,
  frogSize: 40,
  traffic: [
    // y (from top), speed (px/frame), direction (1 = right, -1 = left), color
    { y: 120, speed: 2.2, dir: 1,  color: '#e74c3c' },
    { y: 180, speed: 1.6, dir: -1, color: '#e67e22' },
    { y: 240, speed: 2.5, dir: 1,  color: '#c0392b' },
  ],
  logs: [
    // y, speed, direction, color, length (in cars)
    { y: 300, speed: 1.8, dir: -1, color: '#8e44ad', length: 2 },
    { y: 360, speed: 2.0, dir: 1,  color: '#9b59b6', length: 3 },
    { y: 420, speed: 1.5, dir: -1, color: '#7f8c8d', length: 2 },
  ],
};

// ----------------------------------------------------------
// Helper objects
// ----------------------------------------------------------
class Frog {
  constructor() {
    this.reset();
  }
  reset() {
    this.x = W/2 - config.frogSize/2;
    this.y = H - config.laneHeight/2 - config.frogSize/2;
    this.w = config.frogSize;
    this.h = config.frogSize;
  }
  draw() {
    ctx.fillStyle = '#2ecc71';
    ctx.fillRect(this.x, this.y, this.w, this.h);
  }
  move(dx, dy) {
    const newX = this.x + dx;
    const newY = this.y + dy;
    // keep inside canvas
    if (newX >= 0 && newX + this.w <= W) this.x = newX;
    if (newY >= 0 && newY + this.h <= H) this.y = newY;
  }
  // Checks whether the frog is standing on a log (or water)
  onLog(logs) {
    for (let l of logs) {
      // log occupies the full lane height
      if (this.y + this.h > l.y && this.y < l.y + config.laneHeight) {
        // and the frog's horizontal range overlaps the log's
        if (this.x + this.w > l.x && this.x < l.x + l.w) return l;
      }
    }
    return null;
  }
}

class Vehicle {
  constructor(y, speed, dir, color) {
    this.y = y;
    this.speed = speed;
    this.dir = dir;
    this.color = color;
    this.w = 80;
    this.h = config.laneHeight - 10;
    // spawn randomly off‑screen
    this.x = dir === 1 ? -this.w - Math.random()*200 : W + Math.random()*200;
  }
  update() {
    this.x += this.speed * this.dir;
    // wrap around
    if (this.dir === 1 && this.x > W) this.x = -this.w;
    if (this.dir === -1 && this.x + this.w < 0) this.x = W;
  }
  draw() {
    ctx.fillStyle = this.color;
    ctx.fillRect(this.x, this.y + 5, this.w, this.h);
  }
  collides(frog) {
    return !(frog.x + frog.w < this.x ||
             frog.x > this.x + this.w ||
             frog.y + frog.h < this.y + 5 ||
             frog.y > this.y + 5 + this.h);
  }
}

class Log {
  constructor(y, speed, dir, color, length) {
    this.y = y;
    this.speed = speed;
    this.dir = dir;
    this.color = color;
    this.segmentW = 120;
    this.w = this.segmentW * length;
    this.h = config.laneHeight - 10;
    this.x = dir === 1 ? -this.w - Math.random()*200 : W + Math.random()*200;
  }
  update() {
    this.x += this.speed * this.dir;
    if (this.dir === 1 && this.x > W) this.x = -this.w;
    if (this.dir === -1 && this.x + this.w < 0) this.x = W;
  }
  draw() {
    ctx.fillStyle = this.color;
    ctx.fillRect(this.x, this.y + 5, this.w, this.h);
  }
}

// ----------------------------------------------------------
// Game state
// ----------------------------------------------------------
let frog = new Frog();
let cars = [];
let logs = [];

function init() {
  // create traffic
  cars = config.traffic.map(t => new Vehicle(t.y, t.speed, t.dir, t.color));
  // create logs
  logs = config.logs.map(l => new Log(l.y, l.speed, l.dir, l.color, l.length));
  frog.reset();
  gameOver = false;
  win = false;
}
let gameOver = false;
let win = false;

// ----------------------------------------------------------
// Input handling
// ----------------------------------------------------------
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === 'r' || e.key === 'R') init(); // restart
});
window.addEventListener('keyup', e => keys[e.key] = false);

// ----------------------------------------------------------
// Main loop
// ----------------------------------------------------------
function update() {
  if (gameOver) return;

  // move frog according to keys (one step per press)
  const step = config.laneHeight;
  if (keys['ArrowLeft'])  { frog.move(-step, 0); keys['ArrowLeft'] = false; }
  if (keys['ArrowRight']) { frog.move(step, 0);  keys['ArrowRight'] = false; }
  if (keys['ArrowUp'])    { frog.move(0, -step); keys['ArrowUp'] = false; }
  if (keys['ArrowDown'])  { frog.move(0, step);  keys['ArrowDown'] = false; }

  // update cars
  for (let c of cars) c.update();

  // update logs
  for (let l of logs) l.update();

  // ----- collision with traffic -----
  for (let c of cars) {
    if (c.collides(frog)) {
      gameOver = true;
    }
  }

  // ----- water lanes (log logic) -----
  // water lanes are the rows that contain logs
  const waterRows = config.logs.map(l => l.y);
  const inWater = waterRows.some(y => frog.y + frog.h > y && frog.y < y + config.laneHeight);

  if (inWater) {
    const on = frog.onLog(logs);
    if (on) {
      // move frog along with the log
      frog.x += on.speed * on.dir;
    } else {
      // fell into water
      gameOver = true;
    }
  }

  // ----- win condition -----
  const homeStripHeight = config.laneHeight;
  if (frog.y < homeStripHeight) {
    win = true;
    gameOver = true;
  }

  // keep frog inside horizontal bounds after being pushed by a log
  if (frog.x < 0) frog.x = 0;
  if (frog.x + frog.w > W) frog.x = W - frog.w;
}

function draw() {
  // clear
  ctx.clearRect(0, 0, W, H);

  // ----- background zones -----
  // Home (green)
  ctx.fillStyle = '#27ae60';
  ctx.fillRect(0, 0, W, config.laneHeight);
  // Road (gray)
  ctx.fillStyle = '#34495e';
  ctx.fillRect(0, config.laneHeight*2, W, config.laneHeight * config.traffic.length);
  // Water (blue)
  ctx.fillStyle = '#2980b9';
  ctx.fillRect(0, config.laneHeight*2 + config.laneHeight*config.traffic.length,
               W, config.laneHeight * config.logs.length);

  // draw logs (under frog so you can see if he’s on one)
  for (let l of logs) l.draw();

  // draw traffic
  for (let c of cars) c.draw();

  // draw frog on top
  frog.draw();

  // ----- messages -----
  ctx.fillStyle = '#fff';
  ctx.font = '24px Arial';
  ctx.textAlign = 'center';
  if (gameOver) {
    const msg = win ? 'You made it home! 🎉' : 'Game Over';
    ctx.fillText(msg, W/2, H/2);
    ctx.font = '16px Arial';
    ctx.fillText('Press “R” to restart', W/2, H/2 + 30);
  }
}

// ----------------------------------------------------------
// Animation loop
// ----------------------------------------------------------
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

// start
init();
loop();

</script>
</body>
</html>
